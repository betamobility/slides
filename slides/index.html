    <!-- viewport-fit=cover: without it iOS insets the page from the notch and
         home-indicator areas and paints the gap with the body background, so the
         editor visibly stops short of the screen edges. The app fills the screen
         and positions its own chrome; it never needs the browser to pad it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The editor UI is light-only. Declaring it opts out of Chrome-on-
         Android's auto-darkening (which force-inverts pages and breaks form
         controls) and keeps native <select>/<input> rendering light on
         dark-mode phones. -->
    <meta name="color-scheme" content="only light" />
    <meta name="generator" content="bento-slides" />

    <style>
#bento-splash{position:fixed;inset:0;z-index:9999;display:grid;place-content:center;justify-items:center;gap:26px;background:#F5F3EF;color:#1A1A1A;pointer-events:none;transition:opacity .5s ease;animation:bsAuto .6s ease 9s both}
#bento-splash.done{opacity:0}
.bs-mark{width:168px;animation:bsIn .7s cubic-bezier(.22,1.4,.36,1) both,bsFloat 3.4s ease-in-out .9s infinite}
.bs-mark svg{display:block;width:100%;height:auto}
.bs-word{font:600 15px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1A1A1A;letter-spacing:.42em;text-transform:uppercase;text-indent:.42em;animation:bsUp .6s ease .55s both}
.bs-word b{font-weight:800}
.bs-bar{width:124px;height:2px;border-radius:1px;background:rgba(26,26,26,.13);overflow:hidden;animation:bsUp .5s ease .85s both}
.bs-bar i{display:block;width:44%;height:100%;border-radius:1px;background:#1A1A1A;animation:bsScan 1.1s cubic-bezier(.45,0,.55,1) 1s infinite alternate}
@keyframes bsIn{from{transform:scale(.55);opacity:0}}
@keyframes bsFloat{50%{transform:translateY(-5px)}}
@keyframes bsUp{from{opacity:0;transform:translateY(10px)}}
@keyframes bsScan{from{transform:translateX(-30%)}to{transform:translateX(210%)}}
@keyframes bsAuto{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#bento-splash,#bento-splash *{animation-duration:.01ms;animation-delay:0ms;animation-iteration-count:1}}
    </style>
