<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before and after</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"></svg>
<script>
  // Two panels, before and after, with the change between them. Two steps:
  // the first shows the before panel and the after panel's frame; the second
  // brings in the after figure and the change. Two amounts, when both are
  // above zero, draw a bar in each panel on one scale.
  // Defaults match scene.json, so the file previews on its own in a browser,
  // and the drawing it makes before it is told anything (the last step) IS its
  // still (scripts/build-beta-library-stills.mjs saves it). So: every text
  // names its font as an attribute (a still has no stylesheet), and the layout
  // is arithmetic on character counts, never measured text, so the drawing is
  // the same on every machine.

  // Beta design tokens (beta/v131/tokens.json). Every colour and font drawn
  // here comes from this table; scripts/test-beta-library.ts checks each value
  // against the token file and that the page writes no other colour.
  const TOKENS = {
    '--beta-white': '#FFFFFF',
    '--beta-neutral': '#F7F7F7',
    '--beta-charcoal': '#1A1A1A',
    '--beta-muted': '#666666',
    '--chart-1': '#0F2A4A',
    '--chart-4': '#C7CED6',
    '--color-positive': '#1F7A1F',
    '--color-negative': '#B42318',
    '--font-sans': "'Geist', 'Helvetica Neue', Helvetica, Arial, sans-serif",
    '--font-mono': "'DM Mono', 'Courier New', monospace",
    '--weight-medium': '500',
    '--tracking-sans-display': '-0.01em',
  }
  const SANS = TOKENS['--font-sans'], MONO = TOKENS['--font-mono']
  const INK = TOKENS['--beta-charcoal'], MUTED = TOKENS['--beta-muted']
  const W = 1600, NS = 'http://www.w3.org/2000/svg', M = 120, STEPS = 2
  let H = 900 // follows the frame's shape, so nothing is cropped on a 4:3 deck

  const state = { step: STEPS - 1, reduce: false,
    props: {
      title: 'Average trip to the city centre',
      beforeLabel: 'Before', beforeValue: '38 min', beforeText: 'Bus with one change, morning peak 2024', beforeAmount: 38,
      afterLabel: 'After', afterValue: '24 min', afterText: 'Direct line with signal priority, morning peak 2026', afterAmount: 24,
      change: '−37 %', changeTone: 'good',
      beforeColour: '#C7CED6', afterColour: '#0F2A4A', background: '#FFFFFF',
    } }
  const svg = document.getElementById('scene')
  let raf = 0

  /** A colour a deck may set: a plain CSS colour, never something that loads (the shell refuses those too). */
  const colour = (v, fallback) => (typeof v === 'string' && /^[#a-zA-Z0-9(),.%\s/-]{1,64}$/.test(v) && !/url|expression|var\s*\(/i.test(v) ? v : fallback)
  const text = (v, max) => String(v ?? '').trim().slice(0, max)
  const r1 = (v) => Math.round(v * 10) / 10
  const el = (name, attrs, content) => {
    const n = document.createElementNS(NS, name)
    for (const k in attrs) n.setAttribute(k, attrs[k])
    if (content != null) n.textContent = content
    return n
  }
  /** Words into at most `lines` lines of about `chars` characters; a cut ends in an ellipsis. */
  function wrap(s, chars, lines) {
    chars = Math.max(4, chars)
    const words = String(s).trim().split(/\s+/).filter(Boolean).map((w) => (w.length > chars ? w.slice(0, chars - 1) + '…' : w))
    const out = []
    let cur = ''
    for (const w of words) {
      if (!cur) cur = w
      else if (cur.length + 1 + w.length <= chars) cur += ' ' + w
      else { out.push(cur); cur = w }
    }
    if (cur) out.push(cur)
    if (out.length > lines) {
      out.length = lines
      out[lines - 1] = out[lines - 1].slice(0, chars - 1) + '…'
    }
    return out
  }
  function lines(list, x, y, step, attrs) {
    const t = el('text', { x, y, ...attrs })
    list.forEach((line, i) => t.appendChild(el('tspan', { x, y: r1(y + i * step) }, line)))
    return t
  }
  const amount = (v) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : 0 }

  /** Draw the step; `shown` is how far the after figure has come in, 0 to 1. */
  function draw(shown = state.step >= 1 ? 1 : 0) {
    const p = state.props
    H = Math.round(W * Math.max(0.3, Math.min(3, (window.innerHeight || 9) / (window.innerWidth || 16))))
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`)
    const bg = colour(p.background, TOKENS['--beta-white'])
    svg.replaceChildren(el('rect', { width: W, height: H, fill: bg }))

    let top = 70
    const title = wrap(text(p.title, 200), 48, 2)
    if (title.length) {
      svg.appendChild(lines(title, M, 150, 62, { 'font-family': SANS, 'font-size': 50, 'font-weight': 500, fill: INK }))
      top = 150 + (title.length - 1) * 62 + 60
    }

    const gap = 200, pw = (W - 2 * M - gap) / 2
    const values = [text(p.beforeValue, 24), text(p.afterValue, 24)]
    const longest = Math.max(1, ...values.map((v) => v.length))
    const vs = Math.max(20, Math.min(150, Math.floor((pw - 96) / (longest * 0.62))))
    const a = [amount(p.beforeAmount), amount(p.afterAmount)]
    const bars = a[0] > 0 && a[1] > 0
    const most = Math.max(a[0], a[1])
    const wordChars = Math.floor((pw - 96) / (28 * 0.56))
    const wordLines = Math.max(1, ...[p.beforeText, p.afterText].map((w) => wrap(text(w, 300), wordChars, 3).length))
    // as tall as what it holds, and centred in the room under the title
    const ph = r1(72 + 40 + vs * 0.78 + Math.round(vs * 0.24) + 28 + (bars ? 52 : 0) + wordLines * 38 + 40)
    const py = r1(top + Math.max(0, (H - top - 60 - ph) / 2))
    const panels = [
      { x: M, label: text(p.beforeLabel, 60), value: values[0], words: text(p.beforeText, 300), bar: colour(p.beforeColour, TOKENS['--chart-4']), fill: TOKENS['--beta-neutral'], n: a[0] },
      { x: M + pw + gap, label: text(p.afterLabel, 60), value: values[1], words: text(p.afterText, 300), bar: colour(p.afterColour, TOKENS['--chart-1']), fill: bg, n: a[1] },
    ]
    panels.forEach((q, i) => {
      const x = r1(q.x)
      const g = el('g', {})
      g.appendChild(el('rect', { x, y: py, width: r1(pw), height: ph, rx: 8, fill: q.fill, ...(i === 1 ? { stroke: q.bar, 'stroke-width': 3 } : {}) }))
      g.appendChild(el('text', { x: x + 48, y: r1(py + 72), 'font-family': SANS, 'font-size': 34, 'font-weight': 500, fill: INK }, wrap(q.label, Math.floor((pw - 96) / (34 * 0.56)), 1)[0] ?? ''))
      // the after panel's content comes in on the second step
      const body = el('g', i === 1 && shown < 1 ? { opacity: shown.toFixed(3), transform: `translate(0 ${(24 * (1 - shown)).toFixed(1)})` } : {})
      const valueY = r1(py + 72 + 40 + vs * 0.78)
      // a display figure in Geist with tabular numerals; its descenders clear the bar or the words under it
      body.appendChild(el('text', { x: x + 48, y: valueY, 'font-family': SANS, 'font-size': vs, 'font-weight': TOKENS['--weight-medium'], 'font-variant': 'tabular-nums', 'letter-spacing': TOKENS['--tracking-sans-display'], fill: INK }, q.value))
      let y = valueY + Math.round(vs * 0.24) + 28
      if (bars) {
        body.appendChild(el('rect', { x: x + 48, y: r1(y), width: r1(Math.max(6, (pw - 96) * q.n / most)), height: 28, fill: q.bar }))
        y += 28 + 24
      }
      const words = wrap(q.words, wordChars, 3)
      if (words.length) body.appendChild(lines(words, x + 48, r1(y + 34), 38, { 'font-family': SANS, 'font-size': 28, fill: MUTED }))
      if (i === 0 || shown > 0) g.appendChild(body)
      svg.appendChild(g)
    })

    // the change, between the panels
    const cx = r1(M + pw + gap / 2), cy = r1(py + ph / 2)
    const change = text(p.change, 12)
    const tone = p.changeTone === 'good' ? TOKENS['--color-positive'] : p.changeTone === 'bad' ? TOKENS['--color-negative'] : MUTED
    const mid = el('g', shown < 1 ? { opacity: shown.toFixed(3) } : {})
    mid.appendChild(el('path', { d: `M${cx - 44} ${cy}H${cx + 40}M${cx + 22} ${cy - 18}L${cx + 42} ${cy}L${cx + 22} ${cy + 18}`, fill: 'none', stroke: MUTED, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }))
    if (change) {
      const cs = Math.min(34, Math.floor((gap - 24) / (change.length * 0.6)))
      mid.appendChild(el('text', { x: cx, y: r1(cy + 30 + cs), 'font-family': MONO, 'font-size': cs, 'text-anchor': 'middle', fill: tone }, change))
    }
    if (shown > 0) svg.appendChild(mid)
    svg.setAttribute('aria-label', [text(p.title, 200), `${panels[0].label}: ${panels[0].value}`, shown > 0 ? `${panels[1].label}: ${panels[1].value}` : '', shown > 0 ? change : ''].filter(Boolean).join('; '))
  }

  /** The after figure comes in: at once with motion reduced, else over half a second. */
  function settle(animate) {
    cancelAnimationFrame(raf)
    if (!animate || state.reduce || state.step < 1) return draw()
    const t0 = performance.now()
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / 550)
      draw(1 - Math.pow(1 - k, 3))
      if (k < 1) raf = requestAnimationFrame(tick)
    }
    raf = requestAnimationFrame(tick)
    draw(0)
  }

  window.addEventListener('message', (ev) => {
    if (ev.source !== window.parent) return // never test ev.origin: a sandboxed frame's is 'null'
    const m = ev.data || {}
    if (m.type === 'bento:init') {
      state.step = Math.max(0, Math.min(STEPS - 1, Number(m.step) || 0)) // the last step when the presenter arrives going backwards
      Object.assign(state.props, m.props)
      state.reduce = !!m.reduceMotion
      settle(false)
    } else if (m.type === 'bento:step') {
      const was = state.step
      state.step = Math.max(0, Math.min(STEPS - 1, Number(m.index) || 0))
      settle(state.step > was)
    } else if (m.type === 'bento:props') {
      Object.assign(state.props, m.values)
      settle(false)
    } else if (m.type === 'bento:motion') {
      state.reduce = !!m.reduce
      if (state.reduce) settle(false) // a reveal under way lands at once
    }
  })
  window.addEventListener('resize', () => settle(false))

  // Keys pressed inside the frame never reach the shell: forward them.
  const NAV = { ArrowRight: 'next', ' ': 'next', PageDown: 'next', ArrowLeft: 'prev', PageUp: 'prev', Escape: 'exit' }
  window.addEventListener('keydown', (ev) => {
    const dir = NAV[ev.key]
    if (!dir || ev.defaultPrevented) return
    ev.preventDefault()
    window.parent.postMessage({ type: 'bento:navigate', dir }, '*')
  })

  draw()
  window.parent.postMessage({ type: 'bento:ready' }, '*')
</script>
</body>
</html>
