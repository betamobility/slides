# CI validation gates — validate, never release.
#
# Every PR and every push to main runs: typecheck, the single-file build,
# the splice conformance gate (scripts/shell-gate.mjs — same code the local
# release runs before signing), and the CRDT convergence rig at CI depth.
#
# Deliberately absent: signing, publishing, deploying. Releases are cut
# locally so the signing key never leaves the maintainer's machine and the
# signed bytes are the served bytes (docs/RELEASING.md). Keep it that way —
# do not add secrets or release steps to this workflow.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # PR branches share one group per ref, so a new push collapses onto the tip —
  # only the tip matters there. Pushes to main get a group PER COMMIT, because
  # every merge commit is a distinct state and the post-merge run is the safety
  # net for interaction bugs between PRs merged close together.
  #
  # Per-commit, NOT merely cancel-in-progress:false — that setting alone does
  # not queue every run. GitHub keeps at most ONE pending run per group, so a
  # third push cancels the PENDING one instead of lining up behind it; it
  # protects the run in progress, not the queue. Merging 19 PRs in a row that
  # way cancelled 17 runs on main and left those merge commits unbuilt, and the
  # "four merges in a few minutes" incident this setting was meant to fix was
  # the same failure. A unique group per commit is what actually guarantees it.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  # Moot on main now — each commit is alone in its group — but kept truthful:
  # superseded PR-branch runs still collapse.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------------------
  # BETA FORK GATE. This repository is Beta Mobility's fork of nyblnet/bento
  # that builds ONLY bento/slides (docs/plans/2026-09-08-001-feat-beta-slides-
  # bento-fork-plan.md, KTD1). The upstream `validate` job below builds every
  # app in the monorepo and is disabled here, not deleted, so weekly upstream
  # merges stay small. This job is the slides + kernel subset of `validate`,
  # step for step, plus the Beta rigs (scripts/test-beta-*). The rationale for
  # each upstream step lives on its twin in `validate`; read it there.
  #
  # `test-ci-registered.ts` reads this whole file, so a rig referenced only in
  # the disabled job still counts as registered — which is why `validate` is
  # gated by `if:` rather than removed.
  # ---------------------------------------------------------------------------
  beta:
    if: github.repository != 'nyblnet/bento'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: slides/package-lock.json

      - name: Install
        working-directory: slides
        run: npm ci

      - name: Which targets anim treats as elements
        run: node scripts/test-anim-elements.ts

      - name: Transforms are not silently ignored
        run: node scripts/test-anim-inline.ts

      - name: i18n packed table is current
        run: node scripts/build-i18n.mjs --check

      - name: Language coverage
        run: node scripts/test-i18n-coverage.mjs

      - name: Language packs build and index cleanly
        run: |
          node scripts/build-i18n.mjs --packs "$RUNNER_TEMP/packs"
          node scripts/sign-packs.mjs "$RUNNER_TEMP/packs" --dry

      - name: Typecheck
        working-directory: slides
        run: node_modules/.bin/tsc -b

      - name: Typecheck kernel (standalone)
        working-directory: slides
        run: node_modules/.bin/tsc -p ../kernel

      - name: Build single-file shell
        working-directory: slides
        run: npm run build:single

      - name: Splice conformance gate
        run: node scripts/shell-gate.mjs slides/dist-single/Bento_Slides.bento.html

      - name: Install browser test runtime (beta)
        # Pinned outside app packages, the same pin as the browser jobs below:
        # browser automation is not shipped in documents. BETA FORK: before the
        # release rehearsal, because upstream 1.2.10's signing gate (K4,
        # scripts/derive-pins.mjs) checks the release's pins in a real browser.
        run: |
          npm install --prefix "$RUNNER_TEMP/bento-browser" --no-package-lock --ignore-scripts playwright@1.61.1
          "$RUNNER_TEMP/bento-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/bento-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Release channel rehearsal (slides, throwaway key)
        # Upstream rehearses dash; the fork's product is slides, and its appId
        # is the one thing U1 changed that fails SILENTLY when wrong (a shipped
        # file just declines every update). This signs a manifest with a key it
        # throws away and proves the refusals against kernel/src/update.ts.
        run: node scripts/test-release-channel.mjs --app slides --shell slides/dist-single/Bento_Slides.bento.html

      - name: Shell sizes
        run: node scripts/test-spaces-size.mjs

      - name: Language pack verification rig
        run: node scripts/test-packs.ts

      - name: Tokenizer contract
        run: node scripts/test-tokenize.ts

      - name: Code-morph identity engine
        run: node scripts/test-codediff.ts

      - name: First-page preview rig
        run: node scripts/test-preview.ts

      - name: Media autoplay rig
        run: node scripts/test-media-autoplay.ts

      - name: Return-gate rig
        run: node scripts/test-return-gate.ts

      - name: Offline-mode rig
        run: node scripts/test-offline.ts

      - name: Untrusted-markup sanitizer rig
        run: |
          slides/node_modules/.bin/esbuild scripts/test-sanitize.ts --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/test-sanitize.mjs"
          node "$RUNNER_TEMP/test-sanitize.mjs"

      - name: Export-secrets rig
        run: node scripts/test-export-secrets.ts

      - name: Blob content-address rig
        run: node scripts/test-blobs.ts

      - name: Save-intent rig
        run: node scripts/test-savepurpose.ts

      - name: Guarded storage rig
        run: node scripts/test-storage.ts

      - name: App registry rig
        run: node scripts/test-release-apps.mjs

      - name: Autosave per-app database rig
        run: |
          slides/node_modules/.bin/esbuild scripts/test-autosave.ts --bundle --platform=node --format=esm \
            --alias:fake-indexeddb/auto=./slides/node_modules/fake-indexeddb/auto/index.js \
            --outfile="$RUNNER_TEMP/test-autosave.mjs"
          BENTO_TEST_APP=beta-slides node "$RUNNER_TEMP/test-autosave.mjs"
          BENTO_TEST_APP=bento-slides node "$RUNNER_TEMP/test-autosave.mjs"

      - name: Publish deletion-gate rig
        run: node scripts/test-publish-gate.mjs

      - name: Model key tables match the format
        run: node scripts/build-modelkeys.mjs --check

      - name: Document validation rig
        run: |
          slides/node_modules/.bin/esbuild scripts/test-validate.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/test-validate.mjs"
          node "$RUNNER_TEMP/test-validate.mjs"

      - name: every rig is actually run
        run: node scripts/test-ci-registered.ts

      - name: Theme token gate
        run: node scripts/test-slides-theme.mjs

      - name: Brand palette rig
        run: node scripts/test-theme.ts

      - name: Built-in layout geometry rig
        run: node scripts/test-layouts.ts

      - name: slides store rig
        run: |
          slides/node_modules/.bin/esbuild scripts/test-slide-store.ts --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/test-slide-store.mjs"
          node "$RUNNER_TEMP/test-slide-store.mjs"

      - name: Clipboard embedded-font rig
        run: |
          slides/node_modules/.bin/esbuild scripts/test-clipboard.ts --bundle --platform=node --format=esm --outfile="$RUNNER_TEMP/test-clipboard.mjs"
          node "$RUNNER_TEMP/test-clipboard.mjs"

      - name: CRDT property-removal rig
        run: node scripts/test-crdt-delprop.ts

      - name: CRDT convergence rig
        run: SEEDS=300 node scripts/test-sync.ts

      - name: CRDT equivalence rig (baseline vs candidate, byte for byte)
        run: REQUIRE_LIVE=1 SEEDS=200 STEPS=60 ACTORS=4 node scripts/test-sync-equiv.ts

      - name: CRDT document-shape seam
        run: node scripts/test-sync-shape.ts

      - name: collaborative text on a parent node
        run: node scripts/test-sync-parent-text.ts

      - name: a flat document shape
        run: node scripts/test-sync-flat.ts

      - name: the sync session layer
        run: node --no-warnings scripts/test-sync-session.ts

      - name: relay protocol — one wire format, two clients
        run: node scripts/test-relay-protocol.ts

      # ---- Beta rigs (scripts/test-beta-*), one per implementation unit ----
      # Added by the unit that creates each rig; the plan's Verification
      # Contract is the list.

      # U3: beta/theme.json is a complete, embedded, traceable rendering of
      # the design-system tokens. The rig bundles itself with esbuild from
      # slides/node_modules (validate.ts reaches render.ts, whose imports are
      # extensionless), so it must run after `npm ci` in slides/.
      - name: Beta theme rig
        run: node scripts/test-beta-theme.ts

      - name: Beta templates build
        # beta/templates/ is GENERATED and gitignored (v1.1 U1): each starter
        # deck is spliced into the shell this job just built. This step MUST
        # precede every rig that reads beta/templates/ — the PPTX rig exports
        # client-pitch, the skill rig lists the directory — or they die on
        # ENOENT in a clean checkout.
        run: node scripts/build-beta-templates.mjs

      - name: Beta PPTX export rig
        # The degrade report for a fixture carrying every element kind is pinned
        # before the mapper; the file it writes is unzipped and its XML read.
        run: node scripts/test-beta-pptx.ts

      - name: Beta layouts and templates rigs
        # Fit, roles, validate() and the by-role re-layout (AE5); then that
        # every built template embeds THIS build's runtime (payload hash equal
        # to the shell's — the same check publish-site.mjs runs), so a template
        # built from an older shell can never pass as current.
        run: |
          # Independent radii keep bar baselines square and preserve tiny values.
          node scripts/test-bar-corners.ts
          node scripts/test-beta-general.ts
          node scripts/test-beta-layouts.ts
          node scripts/test-beta-templates-current.ts
          node scripts/build-beta-starter.mjs --check

      - name: Beta AppConfig rig
        # syncHost() precedence for the kernel lift (localStorage override,
        # configured host, platform default; no throw before configureApp).
        run: node scripts/test-beta-appconfig.ts

      - name: Beta marks rig
        # v1.1 U5: beta/logo/* hash to the design-system originals; the
        # favicon data URI (index.html, marks.ts) decodes to favicon-32.png,
        # the splash and marks.ts inline wordmark.svg's element verbatim,
        # upstream's svg mark is gone, the site pages link /logo/*.png and
        # release.mjs copies them; the built shell (from the build step
        # above) carries the same favicon tag.
        run: node scripts/test-beta-marks.ts

      - name: Beta About rig
        # v1.1 U2: openAbout, openHelp and the post-update banner carry no
        # upstream link and route through slides/src/beta/about.ts; the
        # launch check only badges the chip; the fragment's header, promo,
        # credits, changelog anchor and update-section decision (current /
        # newer / failed) are checked in node. Bundles itself with esbuild
        # from slides/node_modules, so after `npm ci`.
        run: node scripts/test-beta-about.ts

      - name: Beta plugin and skill rig
        # Static claims of plugins/beta-slides: published URLs, template names,
        # manifests, inherited rules, and the as-of stamp shape (AE3).
        run: node scripts/test-beta-skill.mjs

      - name: Beta embed rig
        run: |
          slides/node_modules/.bin/esbuild scripts/test-beta-embed.ts --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/test-beta-embed.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-embed.mjs"

      - name: Beta runtime slide rig
        run: |
          slides/node_modules/.bin/esbuild scripts/test-beta-runtime.ts --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/test-beta-runtime.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-runtime.mjs"

      - name: Beta live window rig (browser)
        # Only the slide showing and its neighbours hold a live frame
        # (slides/src/runtime-present.ts). Counted in a real show, in the
        # packaged document: six scenes, the show on the third, three frames.
        run: node scripts/test-beta-liveness.mjs

      - name: Slide multi-select and block move (upstream's rig)
        # The light table moves slides through upstream's moveBlock; its rig
        # runs in upstream's validate job, which the fork gates off.
        run: node scripts/test-slides-multiselect.ts

      - name: Beta light table rig
        # The slide list as a grid (slides/src/beta/lighttable.ts): rows, the
        # gap under the pointer, the drop bar, the arrows, the keyboard move.
        run: node scripts/test-beta-lighttable.ts

      - name: Beta scene settings rig
        # One module reads and writes a scene's settings (slides/src/beta/
        # scenesettings.ts): the format hint grammar, held and refused values,
        # presets, and a web scene's settings in its address's query string.
        run: |
          slides/node_modules/.bin/esbuild scripts/test-beta-scenesettings.ts --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/test-beta-scenesettings.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-scenesettings.mjs"
          # range snapping against a reference that enumerates the steps
          slides/node_modules/.bin/esbuild scripts/fuzz-beta-scenesettings-snap.ts --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/fuzz-beta-scenesettings-snap.mjs"
          FUZZ_N=5000 node --no-warnings "$RUNNER_TEMP/fuzz-beta-scenesettings-snap.mjs"

      - name: Beta scene settings form (browser)
        # The form in the packaged editor: the control each hint picks, one
        # undo step per change, a held value said, a web scene's address.
        run: node scripts/test-beta-scenesettings-browser.mjs

      - name: Beta plugin library bundle is current
        # The splice tool runs the gallery's own reading (slides/src/beta/
        # libraryread.ts), bundled into the plugin (KTD11): stale fails here.
        run: node scripts/build-beta-plugin-library.mjs --check

      - name: Beta scene gallery rig
        # What in a library manifest is trusted (slides/src/beta/gallery.ts),
        # both inserts against the untrusted gate, one undo step, and a
        # collaborator receiving the inserted slide through the sync engine.
        run: |
          slides/node_modules/.bin/esbuild scripts/test-beta-gallery.ts --bundle --platform=node --format=esm \
            --outfile="$RUNNER_TEMP/test-beta-gallery.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-gallery.mjs"

      - name: Beta scene gallery (browser)
        # The dialog on the store origin (played by routes): shelf, detail,
        # insert, empty, failed, signed out; file:// fetches nothing; the
        # button in the phone's ⋯ menu at 320px.
        run: node scripts/test-beta-gallery-browser.mjs

      - name: Beta scene library validates
        # beta/library/<scene>/ folders build into one manifest. --check writes
        # nothing and uploads nothing; the upload is the maintainer's, with the
        # store's service token.
        run: node scripts/build-beta-library.mjs --check

      - name: Beta scene library rig
        # What the build refuses and names (a still over 64 KB, a web scene off
        # Beta's hosts), the two seed scenes, and what the upload sends.
        run: node scripts/test-beta-library.ts

      - name: Beta scene library rig (browser)
        # The seed scenes themselves: each in a sandboxed frame as the shell
        # mounts it, and as a page whose drawing can be read. A scene is copied
        # into decks, so a fault in one is a fault in every deck that took it.
        run: node scripts/test-beta-library-browser.mjs

      - name: Beta light table rig (browser)
        # The same in the packaged editor with a real mouse: slides 2 and 5
        # dragged between 7 and 8, undo, double-click, Escape, a file drop.
        run: node scripts/test-beta-lighttable-browser.mjs

      - name: Beta runtime assets survive a save
        # Upstream prunes doc.assets at save time by walking elements; a
        # runtime slide's scene is named by the slide. Without the fork's hook
        # in slides/src/assets.ts the first save deletes every scene.
        run: node scripts/test-beta-assets.ts

      - name: Beta merge rigs (the fork's hooks in files upstream rewrote)
        # Written by the independent tester for the v1.2.7 merge: a pre-merge
        # runtime deck through the merged gate and a save; the store conflict
        # latch behind upstream's save queue; recovery behind the restore
        # gate; runtime stepping against reveal steps and a following audience;
        # a manual save's queue outcomes; and the built bundle
        # carrying no import.meta (the loader cannot start a module-only
        # script on its first two paths). After the build step.
        run: |
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-roundtrip.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-roundtrip.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-roundtrip.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-store.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-store.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-store.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-steps.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-steps.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-steps.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-follow.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-follow.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-follow.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-manual-outcomes.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-manual-outcomes.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-manual-outcomes.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-handle-queue.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-handle-queue.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-handle-queue.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-follow-lifecycle.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-follow-lifecycle.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-follow-lifecycle.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-round4-follow.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-round4-follow.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-round4-follow.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-round4-recovery.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-round4-recovery.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-round4-recovery.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-round4-paste-export.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-round4-paste-export.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-round4-paste-export.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-round5-save-burst.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-round5-save-burst.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-round5-save-burst.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-round5-update.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-round5-update.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-round5-update.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-round5-export.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-round5-export.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-round5-export.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-round6-templates.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-round6-templates.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-round6-templates.mjs"
          slides/node_modules/.bin/esbuild scripts/test-beta-merge-round6-encrypted.ts --bundle --platform=node --format=esm --external:typescript --log-level=error --outfile="$RUNNER_TEMP/test-beta-merge-round6-encrypted.mjs"
          node --no-warnings "$RUNNER_TEMP/test-beta-merge-round6-encrypted.mjs"
          node scripts/test-beta-merge-bundle.ts

      - name: Reveal steps, with the fork's runtime hook in place
        run: node scripts/test-slides-steps.ts

      - name: Shell payload fingerprint (b64 and b86)
        run: node scripts/test-apphash.ts

      - name: Beta markers (every hook in an upstream file says BETA FORK)
        # Diffs the fork against the upstream tag AGENTS.md names; fetches that
        # one tag from upstream, since this checkout has no history.
        run: node scripts/test-beta-markers.ts --quiet

      - name: Beta schema (the stamp, the file, the public path, the tooling comment)
        # --check pins schema/slides.json to what the gate's tables generate, and
        # (a fork hook in build-schema.mjs) its version-pinned twin to the same
        # bytes: a release publishes both.
        run: |
          node scripts/build-schema.mjs --check
          node scripts/test-beta-schema.ts

      - name: Upstream rigs whose subject the fork touches
        # In upstream's `validate` job, which is gated off here, so registered
        # and never run until listed in this job: the document schema (with
        # the fork's runtime cases), the embed element upstream now owns, and
        # the sidebar multi-select the grid view will build on.
        run: |
          slides/node_modules/.bin/esbuild scripts/test-slides-schema.ts --bundle --platform=node --format=esm --log-level=error --outfile="$RUNNER_TEMP/test-slides-schema.mjs"
          node "$RUNNER_TEMP/test-slides-schema.mjs"
          slides/node_modules/.bin/esbuild scripts/test-embed.ts --bundle --platform=node --format=esm --log-level=error --outfile="$RUNNER_TEMP/test-embed.mjs"
          node --no-warnings "$RUNNER_TEMP/test-embed.mjs"
          node scripts/test-slides-multiselect.ts
          node scripts/test-slides-assets.ts

      - name: Upstream slides and kernel rigs (added with the v1.2.10 merge)
        # BETA FORK: rule 5 of AGENTS.md. Every rig in upstream's validate-slides,
        # validate-kernel, validate-shared and validate-convert slices that the
        # beta job did not run, kept to the ones that pass on the Beta build.
        # Left out on purpose: test-file-handle.ts (matches editor.ts source text
        # that the fork's store-conflict guard changes; the behaviour is covered
        # by the Beta merge rigs), test-bento-check.ts (counts the slides of
        # upstream's starter deck), test-store-backstop.ts (needs fake-indexeddb,
        # which this job does not install), test-seal-gate.mjs (needs the
        # build:sealtest shell), and the spaces, type, convert, docstore, gate-1,
        # Bento ID and publish-account rigs (apps the fork does not ship).
        run: |
          node scripts/test-audience-embed.ts
          node scripts/test-audience-projection.ts
          node scripts/test-blobcache.ts
          node scripts/test-body-seal.ts
          node scripts/test-broadcast-follow.ts
          node scripts/test-ci-skips.mjs
          node scripts/test-code-palette.ts
          node scripts/test-css-balance.ts
          node scripts/test-enc-title.ts
          node scripts/test-field-class.ts
          node scripts/test-gate-parity.ts
          node scripts/test-maths-coverage.ts
          node scripts/test-maths-lite.ts
          node scripts/test-origin-overrides.ts
          node scripts/test-recovery.ts
          node scripts/test-relay-auth.ts
          node scripts/test-relay-broadcast.ts
          node scripts/test-release-history.ts
          node scripts/test-restore.ts
          node scripts/test-savequeue.ts
          node scripts/test-shell-loader.ts
          node scripts/test-slides-accent-contrast.ts
          node scripts/test-slides-aspect-lock.ts
          node scripts/test-slides-bullets.ts
          node scripts/test-slides-code-fence.ts
          node scripts/test-slides-compact-layouts.ts
          node scripts/test-slides-compact.ts
          node scripts/test-slides-compress-deck.ts
