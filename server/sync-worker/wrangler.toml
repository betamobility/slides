# bento-sync relay — Cloudflare Worker + one Durable Object room per docId.
# Deploy:  env -u CLOUDFLARE_API_TOKEN npx wrangler deploy   (OAuth login once)
# Dev:     npx wrangler dev --port 8787 (fully local, no account needed)
#
# BETA FORK: this is Beta Mobility's relay, deployed under Beta's Cloudflare
# account as `beta-sync` at sync.betamobility.ai (the host slides/src/main.ts
# configures). The worker source is upstream's, unchanged; only this config
# differs. See docs/plans/2026-09-08-001-feat-beta-slides-bento-fork-plan.md U2.
name = "beta-sync"
main = "src/worker.js"
compatibility_date = "2026-07-01"

routes = [
  { pattern = "sync.betamobility.ai", custom_domain = true }
]

# Encrypted asset blobs (docs/blob-offload.md). Bound since 2026-09-09: v1.1
# enabled R2 on the account for the deck store, which removed the only reason
# v1 deployed the relay without this binding. Without it the relay answered 501
# on /b/ and clients fell back to inlining, so an asset over BLOB_INLINE_MAX
# (64 KB, kernel/src/sync/crdt.ts) was left out of LIVE sync and reached the
# other author on the next save rather than on paste. The relay still cannot
# read a blob: what it stores is ciphertext keyed by HMAC(roomKey, sha256).
# Create the bucket once with
#   env -u CLOUDFLARE_API_TOKEN npx wrangler r2 bucket create beta-slides-blobs
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "beta-slides-blobs"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
