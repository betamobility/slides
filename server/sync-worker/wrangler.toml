# bento-sync relay — Cloudflare Worker + one Durable Object room per docId.
# Deploy:  npx wrangler deploy          (needs `npx wrangler login` once)
# Dev:     npx wrangler dev --port 8787 (fully local, no account needed)
#
# BETA FORK: this is Beta Mobility's relay, deployed under Beta's Cloudflare
# account as `beta-sync` at sync.betamobility.ai (the host slides/src/main.ts
# configures). The worker source is upstream's, unchanged; only this config
# differs. See docs/plans/2026-09-08-001-feat-beta-slides-bento-fork-plan.md U2.
name = "beta-sync"
main = "src/worker.js"
compatibility_date = "2026-07-01"

routes = [
  { pattern = "sync.betamobility.ai", custom_domain = true }
]

# Encrypted asset blobs (docs/blob-offload.md) are OPTIONAL: with no R2
# binding the /b/ routes answer 501 and clients fall back to inlining small
# assets. Beta runs without the bucket for phase one (plan U2); to add it
# later, restore upstream's `[[r2_buckets]]` block (binding BLOBS).

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
