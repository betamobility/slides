# Beta deck store — Cloudflare Worker + one R2 bucket, behind Cloudflare Access.
# Deploy:  env -u CLOUDFLARE_API_TOKEN npx wrangler deploy   (OAuth login; see README.md)
# Dev:     npx wrangler dev --port 8788                       (local R2, no account needed)
#
# BETA FORK: this worker exists only in the fork. It stores bento/slides files
# at slides.betamobility.ai and serves them unchanged behind Cloudflare Access,
# and passes that host's PUBLIC release-channel paths through to Pages unread.
# Every gated request must carry an assertion the worker verifies itself
# (src/access.js); the public ones carry none, by design.
# Plans: docs/plans/2026-09-08-002-feat-beta-slides-v1-1-plan.md U7 and
#        docs/plans/2026-09-10-001-feat-slides-host-swap-plan.md.
name = "beta-decks"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# BOTH hostnames, on one worker. slides.betamobility.ai is the store now and
# also serves the public release channel through PAGES_ORIGIN; the retired
# decks.betamobility.ai stays here only to answer 301 (and the two handoff
# paths a shipped deck depends on) until it is deleted. Without the first
# entry a wrangler deploy from a fresh clone would reproduce only the retired
# address.
#
# A Worker Custom Domain cannot be created on a hostname that already has a
# CNAME, and the Pages custom domain is one — so the maintainer detaches it
# from Pages first. Do not delete the Pages project: re-attaching its domain
# is the rollback.
routes = [
  { pattern = "slides.betamobility.ai", custom_domain = true },
  { pattern = "decks.betamobility.ai", custom_domain = true }
]

# The decks. R2 must be enabled on the account (paid subscription) before
# this binding can deploy; create the bucket once with
#   env -u CLOUDFLARE_API_TOKEN npx wrangler r2 bucket create beta-decks
[[r2_buckets]]
binding = "DECKS"
bucket_name = "beta-decks"

# Access configuration, read by src/access.js. See README.md, "Access
# applications, in this order" — the ordering is not cosmetic.
# Both values are public to anyone holding a token, and the JWKS is public, so
# they are vars and not secrets. The worker fails closed while either is empty
# or still a placeholder.
[vars]
ACCESS_TEAM_DOMAIN = "round-smoke-5856.cloudflareaccess.com"

# The Pages project that holds the release channel, the templates, the skill
# and the site's static furniture. slides.betamobility.ai serves both surfaces
# now, so the worker proxies the public prefixes here (2026-09-10 plan, KTD2:
# the signed bytes stay on the tree the maintainer publishes, never on the tree
# an agent happens to be deploying from). NEVER derive this from the incoming
# request — a Worker on a Custom Domain that fetches its own hostname
# re-invokes itself.
PAGES_ORIGIN = "beta-slides-site.pages.dev"

# The two hostnames, named rather than inferred, and the two rollout flags.
# The flags exist so the cutover ORDER is a control and not an aspiration
# (2026-09-10 plan, "Cutover order"):
#
#   REDIRECT_OLD_HOST  off until the new host actually answers as the store.
#                      Turned on at cutover step 4. While it is off the old
#                      host behaves exactly as it does today.
#   NEW_ENABLED        off until release v2026.9.3 is published, because /new
#                      clones the published blank template and a pre-release
#                      clone would name the OLD store host. Turned on last,
#                      at step 9. It gates the create branch only — /new keeps
#                      answering a shipped deck's handoff throughout, which is
#                      the whole of KTD9.
STORE_HOST = "slides.betamobility.ai"
OLD_HOST = "decks.betamobility.ai"
REDIRECT_OLD_HOST = "on"
NEW_ENABLED = "on"
# Four applications' AUDs, all four of which the worker must accept while both
# hostnames live: the human app and the service-token app on EACH host. The
# old host's two are pruned when it is deleted, not before.
#
# NOT here, deliberately: the Bypass application's AUD
# (c3f68dd2…, "beta/slides public paths"). A bypassed request carries no
# assertion at all, so there is nothing for the worker to verify — listing it
# would suggest otherwise.
ACCESS_AUDS = "f5fe14af27d7aa8f32ac5c6d3128fb3d494de08b7d38d62c91e7f69749be24a2,a8a10a36f601ed863163dde8d70e0a31a9f8c51270d83b518238207102cab67a,3ed30ed3c945ed29b8f8c680555cc7d3b4535e2df9301a3542b9a5de5349272d,547e529820867f3e06b129f20582647d9edcf12a7203a88235c5b7877ad0eb3e"
